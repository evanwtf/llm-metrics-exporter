name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, Linux, X64]
    steps:
      # A shared self-hosted runner: keep Go's caches inside this run, so a
      # sibling job's files (possibly root-owned) cannot break this one. The
      # runner context is not available in job-level env, hence this step.
      - name: scope Go caches to this run
        run: |
          echo "GOCACHE=$RUNNER_TEMP/go-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: shared development checks
        # Keep going after a failure so independent checks still report results.
        run: make -k check
      - name: build every release target
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -trimpath -o "dist/llm-metrics-exporter-${target%/*}-${target#*/}" ./cmd/llm-metrics-exporter
          done
      - name: run the linux/amd64 binary
        # Building is not enough: run what ships.
        run: |
          out=$(dist/llm-metrics-exporter-linux-amd64 --version)
          echo "$out"
          echo "$out" | grep -q "version=$(sed -n 's/^const Version = "\(.*\)"/\1/p' internal/version/version.go)"
      - name: compose file is valid
        run: docker compose config -q
      - name: engine-switch throughput queries
        # Same Prometheus image as the optional Compose agent; no Go dependency.
        run: >-
          docker run --rm --network none --entrypoint /bin/promtool
          -v "$PWD/internal/discovery/testdata:/tests:ro"
          prom/prometheus:v3.14.0 test rules /tests/rates.test.yml
      - name: build the image and run it
        # The exact runtime stage production uses. It is shell-less, so run it:
        # --version, then serve a real registration written by the host binary.
        run: |
          img=llm-metrics-exporter:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT
          name=lme-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT
          reg=$RUNNER_TEMP/registrations-$GITHUB_RUN_ID
          trap 'docker rm -f "$name" >/dev/null 2>&1; docker rmi "$img" >/dev/null 2>&1' EXIT
          docker build --build-arg REVISION="$(git rev-parse --short HEAD)" -t "$img" .
          docker run --rm "$img" --version
          # An arm with nothing listening: it must read as down, not vanish.
          dist/llm-metrics-exporter-linux-amd64 register --registration-dir "$reg" \
            --backend ci --engine vllm --endpoint http://127.0.0.1:1 --model ci-model --nodes 1 --run-id ci
          chmod -R a+rX "$reg"
          docker run -d --name "$name" -p 127.0.0.1::9109 -v "$reg:/registrations:ro" "$img"
          port=$(docker port "$name" 9109/tcp | head -1 | sed 's/.*://')
          for i in $(seq 1 20); do curl -sf "http://127.0.0.1:$port/healthz" >/dev/null && break; sleep 0.5; done
          docker exec "$name" /usr/bin/llm-metrics-exporter health
          body=$(curl -sf "http://127.0.0.1:$port/metrics")
          echo "$body" | grep '^llme_'
          echo "$body" | grep -q '^llme_engine_up{backend="ci",engine="vllm",.*model="ci-model",nodes="1"} 0$'

  macos:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      # A shared self-hosted runner: keep Go's caches inside this run, so a
      # sibling job's files (possibly root-owned) cannot break this one. The
      # runner context is not available in job-level env, hence this step.
      - name: scope Go caches to this run
        run: |
          echo "GOCACHE=$RUNNER_TEMP/go-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # The race detector needs cgo, which the macOS runner has.
      - run: make race
      - run: make build && ./dist/llm-metrics-exporter --version
